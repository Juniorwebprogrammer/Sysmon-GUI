[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sysmon-gui"
version = "1.0.0"
description = "System monitor with clipboard manager for Linux"
requires-python = ">=3.10"
dependencies = [
    "pyperclip",
    "pynput",
    "psutil",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"app/presentation/**/*.py" = ["E402"]
"app/infrastructure/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
